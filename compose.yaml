name: multitenant-invoicing

# stack de desenvolvimento: bind mount, artisan serve e senha fraca no banco. Imagem de produção
# é o target prod do docker/Dockerfile (ver README)
x-php: &php
  build:
    context: docker
    target: dev
    # mesmo dono dos arquivos do bind mount, senão o container não escreve em vendor/ e storage/
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: multitenant-invoicing-php
  volumes: [".:/app"]
  environment: &env
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: invoicing
    DB_USERNAME: invoicing
    DB_PASSWORD: ${DB_PASSWORD:-invoicing}
    QUEUE_CONNECTION: database
    OUTBOX_URL: ${OUTBOX_URL:-http://outbox-gateway:8080}
    # stack trace do job q falhou aparece no docker compose logs, não fica escondido em storage/logs
    LOG_CHANNEL: stderr

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: invoicing
      POSTGRES_PASSWORD: ${DB_PASSWORD:-invoicing}
      POSTGRES_DB: invoicing
    volumes:
      # o 18 guarda em /var/lib/postgresql/18/docker, o volume vai no pai
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    # só na máquina local: banco com senha fraca não pode ficar aberto na rede
    ports: ["127.0.0.1:${DB_PORT_HOST:-5434}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "invoicing"]
      interval: 2s
      retries: 30

  setup:
    <<: *php
    command: ["sh", "docker/setup.sh"]
    depends_on:
      db: { condition: service_healthy }

  vite:
    <<: *php
    command: ["sh", "-c", "npm ci && npm run build"]
    depends_on:
      setup: { condition: service_completed_successfully }

  app:
    <<: *php
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      retries: 3
      start_period: 20s
    depends_on:
      vite: { condition: service_completed_successfully }

  queue:
    <<: *php
    # --max-time recicla o worker de hora em hora (memória e código novo do bind mount)
    command: ["php", "artisan", "queue:work", "--queue=default", "--max-time=3600"]
    restart: unless-stopped
    healthcheck:
      # o worker toca o arquivo a cada volta do loop (AppServiceProvider)
      test: ["CMD-SHELL", "find storage/framework/queue-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      retries: 3
      start_period: 30s
    depends_on:
      setup: { condition: service_completed_successfully }

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    healthcheck:
      # o scheduler toca o arquivo todo minuto (routes/console.php)
      test: ["CMD-SHELL", "find storage/framework/schedule-heartbeat -mmin -3 | grep -q ."]
      interval: 60s
      retries: 3
      start_period: 90s
    depends_on:
      setup: { condition: service_completed_successfully }

  # opcional: docker compose --profile outbox up. Sem ele o OUTBOX_URL não resolve,
  # o envio falha com erro de conexão e o job volta pra fila com backoff.
  # fixado num commit: push no outro repo não muda o CI daqui sem um commit explícito subindo a versão
  outbox-gateway:
    profiles: ["outbox"]
    build: https://github.com/MiguelSanzBr/outbox-gateway-demo.git#0308aca6f56789b167acf67bf21755fff33292dd
    command: ["/gateway"]
    environment:
      DATABASE_URL: postgres://invoicing:${DB_PASSWORD:-invoicing}@db:5432/outbox
      PROVIDER_URL: http://outbox-mock:9090/v1/messages
    depends_on:
      db: { condition: service_healthy }
      outbox-mock: { condition: service_started }

  outbox-mock:
    profiles: ["outbox"]
    build: https://github.com/MiguelSanzBr/outbox-gateway-demo.git#0308aca6f56789b167acf67bf21755fff33292dd
    command: ["/mockprovider"]

volumes:
  pgdata:
